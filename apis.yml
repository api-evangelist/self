aid: self
name: Self
description: Self (Self Financial, Inc.) is a fintech platform that helps people build
  credit, savings, and access to cash through a small set of consumer financial products.
  Its Credit Builder Account pairs a small installment loan with a locked savings
  deposit and reports on-time payments to all three major credit bureaus; the Self
  Secured Credit Card requires no credit check, and Rent & Bills Reporting and Self
  Cash round out the lineup. Self serves several million members and is a Techstars
  portfolio company. It is a consumer-facing product with no public developer API or
  documentation surface at this time; this profile captures the company's public
  identity, security posture, and compliance certifications.
